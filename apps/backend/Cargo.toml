[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
alloy = { version = "1", features = ["serde", "k256", "sol-types"] }
axum = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }
config = "0.15"
csv = "1"
eyre = "0.6"
clap = { version = "4", features = ["derive"] }
k256 = { version = "0.13", features = ["ecdsa"] }
postgres = "0.19"
prometheus = "0.14"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
thiserror = "2"
url = { version = "2", features = ["serde"] }
serial_test = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zksync-lite-sunset-core = { path = "crates/zksync-lite-sunset-core" }
zksync-lite-sunset-snapshot = { path = "crates/zksync-lite-sunset-snapshot" }
merkle-tree-generator = { git = "https://github.com/matter-labs/merkle-tree-generator", rev = "724902cddb21eeafa0feb41041bc6e4540f31c3a" }

[profile.profiling]
inherits = "release"
debug = true
