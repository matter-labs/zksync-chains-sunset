name: contracts-claims

on:
  push:
    paths:
      - 'contracts/zksync-lite-migration-claims/**'
      - '.github/workflows/contracts-claims.yml'
  pull_request:
    paths:
      - 'contracts/zksync-lite-migration-claims/**'
      - '.github/workflows/contracts-claims.yml'

defaults:
  run:
    working-directory: contracts/zksync-lite-migration-claims

jobs:
  claims:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Format
        run: forge fmt --check

      - name: Build
        run: forge build

      - name: Test
        run: forge test
