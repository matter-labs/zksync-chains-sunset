[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

optimizer = true
optimizer_runs = 200
via_ir = true

# Keep explicit so compiler upgrades are intentional.
solc_version = "0.8.24"
evm_version = "paris"

# Allow MigrateTokens.s.sol to read the tokens snapshot from the repo root.
fs_permissions = [{ access = "read", path = "../../sepolia" }]
